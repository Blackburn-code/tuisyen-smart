name: Bina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sediakan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang Capacitor
        run: npm install

      - name: Cipta projek Android
        run: npx cap add android

      - name: Pasang ikon aplikasi
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-res/mipmap-* $RES/

      - name: Pasang plugin asli (cetak & simpan fail)
        run: |
          JAVA_DIR=android/app/src/main/java/com/blackburn/tuisyensmart
          cp android-res/java/*.java $JAVA_DIR/

      - name: Salin fail aplikasi ke Android
        run: npx cap sync android

      - name: Guna kunci tandatangan tetap (supaya kemas kini tidak padam data)
        run: |
          mkdir -p ~/.android
          cp android-res/debug.keystore ~/.android/debug.keystore

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Namakan APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TuisyenSmart-${{ github.run_number }}.apk

      - name: Simpan APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TuisyenSmart-APK
          path: TuisyenSmart-${{ github.run_number }}.apk

      - name: Terbitkan di Releases (mudah dimuat turun dari telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tuisyen Smart (binaan ${{ github.run_number }})
          body: Muat turun fail .apk di bawah dan pasang pada telefon Android.
          files: TuisyenSmart-${{ github.run_number }}.apk
